<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분석 결과 보고서로 이동 중...</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:#101B33;color:#fff;}
  .box{max-width:420px;text-align:center;padding:32px;}
  h1{font-size:1.05rem;margin:0 0 10px;}
  p{font-size:0.85rem;color:#CBD5EA;margin:0 0 22px;line-height:1.6;}
  a.btn{display:inline-block;background:#D8A857;color:#241A05;font-weight:800;padding:13px 24px;
    border-radius:12px;text-decoration:none;font-size:0.92rem;}
  .spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:#D8A857;
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
<script>
  // meta refresh와 동시에 걸면 같은 exec 주소로 이중 요청이 발생해
  // Apps Script 쪽에서 "현재 파일을 열 수 없습니다" 오류가 날 수 있어 JS 리다이렉트만 사용한다.
  window.location.replace("https://script.google.com/macros/s/AKfycbyEzkL2YT74gEY1UGdWefuOhIhpiXzARo6IIdZ1xb6I-xGboNH_SjBysQqLfsQeddeo/exec?page=report");
</script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Borich 분석 결과 보고서로 이동합니다...</h1>
    <p>자동으로 이동하지 않으면 아래 버튼을 눌러 주세요. (접속 코드 입력 화면이 나옵니다.)</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbyEzkL2YT74gEY1UGdWefuOhIhpiXzARo6IIdZ1xb6I-xGboNH_SjBysQqLfsQeddeo/exec?page=report">지금 이동하기</a>
  </div>
</body>
</html>
